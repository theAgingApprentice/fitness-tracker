services:
  fitness-tracker:
    build:
      context: .
      dockerfile: app/Dockerfile
    image: fitness-tracker:latest
    container_name: fitness-tracker
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - mitchellnet
      - fitness-internal
    depends_on:
      - fitness-tracker-db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  fitness-tracker-db:
    image: mariadb:11
    container_name: fitness-tracker-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - fitness_tracker_data:/var/lib/mysql
      - ./database/structure:/docker-entrypoint-initdb.d:ro
    networks:
      - fitness-internal

networks:
  mitchellnet:
    external: true
  fitness-internal:
    driver: bridge

volumes:
  fitness_tracker_data:
